apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
      # Override args (not command) so the image's default entrypoint still
      # dispatches to `mini`. Keep HTTPS on 8333 for Thanos and expose HTTP on
      # 8334 for the LokiStack, whose test storage secret has no SeaweedFS CA.
      # Disable the WebDAV and Iceberg listeners that `mini` starts by default —
      # neither is used here, and leaving them off reduces the container's
      # exposed surface.
      - args:
        - mini
        - -dir=/data
        - -s3.port=8334
        - -s3.port.https=8333
        - -s3.cert.file=/etc/seaweedfs/certs/public.crt
        - -s3.key.file=/etc/seaweedfs/certs/private.key
        - -webdav=false
        - -s3.port.iceberg=0
        env:
        - name: AWS_ACCESS_KEY_ID
          value: seaweedfsadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedfsadmin
        - name: S3_BUCKET
          value: thanos,acm-observability-logs
        image: chrislusf/seaweedfs:4.29
        name: seaweedfs
        ports:
        - containerPort: 8333
          protocol: TCP
        - containerPort: 8334
          protocol: TCP
        volumeMounts:
        - mountPath: /data
          name: storage
        - mountPath: /etc/seaweedfs/certs
          name: tls-certs
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: seaweedfs
      - name: tls-certs
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          - key: public.crt
            path: public.crt
          - key: private.key
            path: private.key
          secretName: seaweedfs-tls-secret
