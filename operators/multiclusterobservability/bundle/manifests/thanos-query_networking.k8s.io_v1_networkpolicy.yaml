---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thanos-query
  namespace: open-cluster-management-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
      app.kubernetes.io/part-of: observatorium
  ingress:
    - port: 9090
      protocol: TCP
  # need to talk to recievers, store, rule?
  egress:
    - {}
  policyTypes:
    - Ingress
    - Egress
