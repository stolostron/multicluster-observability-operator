                "content": "#### **Understanding Series Churn Ratio**\n\nThe `cardinality_churn_ratio` metric measures the fraction (`0.0` to `1.0`) of time series in the 10-minute sliding window that were newly created rather than continuously active across sub-windows.\n\n* **`0.0`:** Zero churn — the exact same set of time series remained stable throughout the window.\n* **`> 0.3`:** Moderate to high churn — e.g., frequent pod restarts, CronJobs, or ephemeral labels (`pod_uuid`, `request_id`, `container_id`) creating short-lived series.",
