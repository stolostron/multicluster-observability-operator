                "code": {
                  "language": "plaintext",
                  "showLineNumbers": false,
                  "showMiniMap": false
                },
                "content": "### **📝 Managing Monitoring Cardinality**\n\nThis dashboard helps you visualize the metric cardinality and series churn ingested from all managed clusters. Understanding and controlling cardinality is crucial, as the number of unique metrics directly correlates with the CPU, memory, and storage resources required by the Thanos monitoring platform.\n\n#### **⚡ Real-Time Probabilistic Estimation (HyperLogLog)**\n\nCardinality and series churn are computed continuously on the Hub by the `observability-cardinality-estimator` service using **Time-Sliced Bloom Filters** and **Sliding-Window HyperLogLog (HLL)** sketches over a 10-minute sliding window, pushed to Thanos every **60 seconds**.\n\n#### **🤔 What is Cardinality & Churn?**\n\n* **Cardinality (`cardinality_estimate`):** The total number of unique **time series** active over the 10-minute window. A time series is a unique combination of a **metric name** and its descriptive **labels**.\n* **Series Churn Ratio (`cardinality_churn_ratio`):** The ratio (`0.0` to `1.0`) of short-lived or newly created series entering the window relative to the active series count. High churn puts heavy pressure on the TSDB head block and index even when standing cardinality appears stable.\n\n#### **🔍 How to Use These Dashboards**\n\n1. **Cardinality Outliers:** Automatically identifies clusters and metrics whose cardinality exceeds 3 standard deviations above the fleet average.\n2. **Series Churn Ratio (10m Window):** Expand the second row to inspect the top clusters and metrics generating high series churn.\n3. **Cluster Cardinality:** Shows the total number of series sent by each managed cluster. Click on a cluster to drill down by namespace and pod.\n4. **Metric Cardinality:** Shows the highest-cardinality metrics across all clusters. Click on a metric to drill down by cluster, namespace, and pod.",
                "mode": "markdown"
              },
              "pluginVersion": "11.6.1",
              "title": "",
              "type": "text"
            }
          ],
          "title": "Dashboard Guide (Click to Expand)",
          "type": "row"
        },
