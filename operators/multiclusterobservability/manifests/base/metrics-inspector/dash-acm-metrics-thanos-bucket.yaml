        {
          "datasource": {
            "type": "prometheus",
            "uid": "000000001"
          },
          "description": "Retention and saturation status across resolution tiers. Compares the age of the oldest stored block (minTime) against the configured retention limit. Saturation represents the percentage of the retention window currently populated with blocks.\n\n**Why Oldest Block Age can exceed configured retention (>100% saturation):**\n\n- **TSDB Block Atomicity:** Blocks are immutable. Thanos Compactor only prunes a block when its entire time window has expired (`block.MaxTime < now - retention`). Partial block pruning is not supported.\n\n- **Compaction Block Spans:** Horizontally compacted blocks can span up to 2 weeks (compaction level 6). A block spanning `[T_min, T_max]` cannot be deleted until `T_max` expires (`now - retention`). Consequently, its oldest samples (`T_min`) remain active in the bucket for up to *(retention + block_span)* (e.g., 6d retention + 14d span = up to ~20 days).\n\n- **Deletion Delay:** Expired blocks are first flagged with deletion marks and retained for `--delete-delay` (typically 48h\u201350h) before physical deletion to allow running queries to finish cleanly.",
