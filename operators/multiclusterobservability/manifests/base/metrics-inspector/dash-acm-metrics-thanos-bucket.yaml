                },
                "content": "### **\ud83e\udea3 Understanding Thanos Object Storage Architecture**\n\nThis dashboard visualizes the capacity, growth trajectory, and retention health of the Thanos object storage bucket. In Red Hat Advanced Cluster Management (RHACM), all historical observability metrics forwarded by managed clusters are packaged and archived into this bucket for long-term queryability.\n\n---\n\n#### **\ud83c\udfd7\ufe0f How Metrics Reach the Bucket**\n\n* **2-Hour TSDB Blocks:** Incoming metrics are initially processed in-memory and on fast local NVMe/SSD disks by **Thanos Receive** (or Prometheus Sidecar). Every **2 hours**, the TSDB head is cut into an immutable 2-hour TSDB **block** and uploaded to object storage.\n* **What is a Block?** A block is an immutable directory in object storage named after a UUID (ULID). It contains:\n  * **`chunks/`**: Compressed raw metric sample values.\n  * **`index`**: Inverted index mapping series label pairs (`cluster=\"prod\"`, `__name__=\"node_cpu_seconds_total\"`) to chunk locations.\n  * **`meta.json`**: Metadata describing the block's time range (`minTime` to `maxTime`), compaction level, resolution tier, and stats.\n* **Thanos Compactor:** A background controller that continuously inspects the bucket to:\n  * **Compact:** Merge multiple contiguous 2-hour blocks into larger 8-hour, 2-day, or 2-week blocks to deduplicate index entries and optimize query speed.\n  * **Downsample:** Create low-resolution copies of old data (**5m** and **1h** downsampling) to keep long-term historical queries fast.\n  * **Enforce Retention:** Mark expired blocks with `deletion-mark.json` and delete them after the grace period.\n\n---\n\n#### **\ud83d\udcca Core Metrics & Concepts Explained**\n\n* **Resolution Tiers (`resolution`):**\n  * **`raw` (Full Fidelity):** Unmodified 2-hour blocks containing every collected sample. Essential for high-resolution troubleshooting over recent days. Typically retained for short-to-medium durations (e.g., 14\u201330 days).\n  * **`5m` (5-Minute Downsampled):** Precomputed aggregates (min, max, sum, count, counter) calculated for every 5-minute interval. Enables fast dashboard rendering across weeks without downloading millions of individual raw points.\n  * **`1h` (1-Hour Downsampled):** Aggregates computed for every 1-hour interval. Retained for long-term capacity planning and multi-month / multi-year audit compliance with minimal storage overhead.\n* **Storage Footprint by Age Tier:**\n  * Categorizes data into age buckets (`0-7d`, `7-30d`, `30-90d`, `90-180d`, `180d+`). In healthy systems, the newest tiers dominate the raw footprint, while older tiers flatten out into compact downsampled data.\n* **Storage Burn Rate:**\n  * The rate of storage growth (GiB/day or bytes/sec) entering the bucket. Calculated from the volume and non-overlapping time span of active raw blocks in the post-compaction window (**24h to 7 days old**). Data younger than 24 hours is intentionally excluded from the burn rate baseline because newly cut 2-hour blocks contain duplicate receiver replicas (e.g., replication factor = 3) and unmerged index postings before Thanos Compactor performs horizontal compaction and replica deduplication. Filtering out this initial 24-hour window yields the true post-compaction storage burn rate, avoiding an artificial 2×–3× inflation in long-term projections.\n* **Steady-State Capacity Forecast & Limitations:**\n  * **What it represents:** When metrics collection begins, bucket storage grows continuously until data reaches configured retention limits. Once reached, Thanos Compactor purges expired blocks at the same rate new blocks arrive, reaching equilibrium. The steady-state projection models total storage once all retention tiers reach equilibrium:\n    * `Steady-State Capacity = (Burn Rate[raw] \u00d7 Retention[raw]) + (Burn Rate[5m] \u00d7 Retention[5m]) + (Burn Rate[1h] \u00d7 Retention[1h])`\n  * **How it is calculated:** The raw burn rate is measured from active compacted blocks in the **24h to 7 day window** (falling back to older compacted blocks or all raw blocks on Day 1 of a cluster). Downsampled burn rates (`5m` and `1h`) are determined using **empirical downsampling ratios** measured directly from overlapping historical blocks in the bucket (or baseline defaults if downsampling is brand new).\n  * **Infinite Retention (0d):** If any resolution tier is configured with 0d retention (infinite retention in Thanos), steady-state storage is mathematically unbounded. In this case, metrics-inspector omits the projection metric, and the **Steady-State Capacity Forecast** panel displays **Infinite / Unbounded**.\n  * **Impact of Recent Bursts:** Because the raw burn rate is derived from the recent 24h to 7 day window, a sustained cardinality burst (e.g., heavy pod churn, temporary debug metrics, or incident flapping) will elevate the burn rate once compacted (~24h after upload). Extrapolating this across full long-term retentions (e.g., 90d or 365d) can cause a **magnified temporary increase in the projected steady-state**.\n  * **Lag in Reflecting Pruning:** When metrics are dropped or allowlists are tightened, the projection reflects the reduction after 24 hours (when new smaller blocks enter the post-compaction baseline) and fully stabilizes over 7 days as older high-volume blocks shift out of the 7-day window.\n  * **Fleet Sizing Assumption:** The projection assumes the current fleet size, scrape intervals, and metric volume remain constant. As you onboard additional managed clusters, the steady-state projection will scale proportionally.\n* **Retention Pruning Queue & Deletion Marks:**\n  * When a block exceeds its retention policy, Thanos Compactor writes a `deletion-mark.json` marker. Blocks in this state are hidden from queries and slated for hard deletion after a safety delay (default 48h). A growing deletion queue without deletions suggests compactor permissions or deletion stalls.\n\n---\n\n#### **\ud83d\udd0d Quick Triage Checklist**\n\n1. **Is storage growing faster than expected?** Check **Raw Storage Burn Rate** and compare it with the **Metric Cardinality** dashboard to find churn or high-frequency series.\n2. **Has retention stabilized?** Check **Retention & Saturation Status by Resolution Tier**. If the age span is approaching the retention limit, storage will soon level off.\n3. **Are downsampling and compaction healthy?** Verify that **5m** and **1h** tiers exist in **Storage Footprint by Resolution Tier** and that **TSDB Blocks Active vs Deletion Marks** shows steady block consolidation without compaction failures.",
                "mode": "markdown"
              },
              "pluginVersion": "11.6.1",
