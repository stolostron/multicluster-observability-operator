apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/component: platform-metrics-collector
    app.kubernetes.io/part-of: multicluster-observability-addon
    app.kubernetes.io/managed-by: multicluster-observability-operator
  name: platform-metrics-cardinality
  namespace: open-cluster-management-observability
spec:
  jobName: cardinality
  metricsPath: /federate
  params:
    match[]:
    - '{__name__="thanos_bucket_blocks"}'
    - '{__name__="thanos_bucket_cached_blocks"}'
    - '{__name__="thanos_bucket_chunks"}'
    - '{__name__="thanos_bucket_configured_retention_seconds"}'
    - '{__name__="thanos_bucket_last_sync_duration_seconds"}'
    - '{__name__="thanos_bucket_last_sync_timestamp_seconds"}'
    - '{__name__="thanos_bucket_newest_block_timestamp_seconds"}'
    - '{__name__="thanos_bucket_oldest_block_timestamp_seconds"}'
    - '{__name__="thanos_bucket_recent_block_series"}'
    - '{__name__="thanos_bucket_samples"}'
    - '{__name__="thanos_bucket_spanned_seconds"}'
    - '{__name__="thanos_bucket_storage_bytes"}'
    - '{__name__="thanos_bucket_sync_errors_total"}'
    - '{__name__="thanos_bucket_syncs_total"}'
    - '{__name__="cardinality_estimator_deduplicated_series_total"}'
    - '{__name__="cardinality_estimator_ingested_series_total"}'
    - '{__name__="cardinality_estimator_last_push_timestamp_seconds"}'
    - '{__name__="cardinality_estimator_push_errors_total"}'
    - '{__name__="cardinality_estimator_push_success_total"}'
    - '{__name__="cardinality_estimator_pushed_series_total"}'
    - '{__name__="cardinality_estimator_write_errors_total"}'
    - '{__name__="cardinality_estimator_write_requests_total"}'
  metricRelabelings:
  - action: labeldrop
    regex: managed_cluster|managed_cluster_name|id
