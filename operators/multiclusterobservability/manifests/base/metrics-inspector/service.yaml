apiVersion: v1
kind: Service
metadata:
  name: observability-metrics-inspector
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/component: metrics-inspector
    app.kubernetes.io/name: observability-metrics-inspector
    app.kubernetes.io/part-of: multicluster-observability-operator
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: observability-metrics-inspector-metrics-certs
spec:
  type: ClusterIP
  ports:
    - name: https-write
      port: 8490
      targetPort: https-write
      protocol: TCP
    - name: https-metrics
      port: 8444
      targetPort: https-metrics
      protocol: TCP
  selector:
    app.kubernetes.io/component: metrics-inspector
    app.kubernetes.io/name: observability-metrics-inspector
