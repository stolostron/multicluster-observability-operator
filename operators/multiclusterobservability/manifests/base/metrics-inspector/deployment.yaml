apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-metrics-inspector
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/component: metrics-inspector
    app.kubernetes.io/name: observability-metrics-inspector
    app.kubernetes.io/part-of: multicluster-observability-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics-inspector
      app.kubernetes.io/name: observability-metrics-inspector
  template:
    metadata:
      labels:
        app.kubernetes.io/component: metrics-inspector
        app.kubernetes.io/name: observability-metrics-inspector
        app.kubernetes.io/part-of: multicluster-observability-operator
    spec:
      automountServiceAccountToken: false
      serviceAccountName: observability-metrics-inspector
      securityContext:
        runAsNonRoot: true
      containers:
        - name: metrics-inspector
          image: quay.io/stolostron/metrics-inspector:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/metrics-inspector/config.yaml
            - --estimator.interval=15m
            - --web.listen-address=:8490
            - --metrics.listen-address=127.0.0.1:8080
            - --tls.server.cert-file=/var/metrics-inspector/server-certs/tls.crt
            - --tls.server.key-file=/var/metrics-inspector/server-certs/tls.key
            - --tls.client-ca-file=/var/metrics-inspector/client-ca/ca.crt
            - --remote-write.interval=60s
            - --remote-write.initial-delay=5m
          ports:
            - name: https-write
              containerPort: 8490
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: https-write
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https-write
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/metrics-inspector
              readOnly: true
            - name: server-certs
              mountPath: /var/metrics-inspector/server-certs
              readOnly: true
            - name: client-ca
              mountPath: /var/metrics-inspector/client-ca
              readOnly: true
        - name: kube-rbac-proxy
          image: quay.io/stolostron/kube-rbac-proxy:latest
          imagePullPolicy: IfNotPresent
          args:
            - --secure-listen-address=0.0.0.0:8444
            - --upstream=http://127.0.0.1:8080
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --logtostderr=true
            - --allow-paths=/metrics
          ports:
            - name: https-metrics
              containerPort: 8444
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 40Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: metrics-certs
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-metrics-inspector-config
        - name: server-certs
          secret:
            secretName: observability-server-certs
        - name: client-ca
          secret:
            secretName: observability-client-ca-certs
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: metrics-certs
          secret:
            secretName: observability-metrics-inspector-metrics-certs
