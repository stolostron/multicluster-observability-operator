---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  annotations:
    pipelinesascode.tekton.dev/task: "[mco-install, mco-e2e-tests]"
  name: mco-e2e-tests-pipeline
spec:
  description: |
    This pipeline automates the process of running end-to-end tests for MCO
    using HyperShift-based ephemeral clusters. The pipeline provisions a hub and
    a managed cluster, installs OCM hub/spoke core and the MCO operator via the
    existing setup scripts, imports the managed cluster, then runs the Ginkgo e2e
    test suite via the existing run-e2e-tests.sh script.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'mco-e2e-tests'
    - name: ACM_VERSION
      description: 'ACM release version for downstream dev catalog channel'
      default: '5.1'
    - name: MCE_VERSION
      description: 'MCE release version for downstream dev catalog channel'
      default: '5.1'
    - name: OCP_VERSION
      description: 'OpenShift minor version for the ephemeral HyperShift clusters'
      default: '4.21'
    - name: HUB_COMPUTE_NODE_TYPE
      description: 'AWS instance type for the hub cluster worker nodes'
      default: 'm5.2xlarge'
    - name: MANAGED_COMPUTE_NODE_TYPE
      description: 'AWS instance type for the managed cluster worker nodes'
      default: 'm5.xlarge'
    - name: HYPERSHIFT_NODE_COUNT
      description: 'Number of worker nodes in each ephemeral HyperShift cluster'
      default: '3'
    - name: HOSTED_MANAGEMENT_CLUSTER
      description: 'Hosted management cluster used to provision the ephemeral clusters'
      default: 'hosted-mgmt2'
    - name: DEBUG_DUMP_CREDENTIALS
      description: 'When "true", print hub/managed cluster kubeconfigs and admin passwords to the pipeline logs for manual debugging. ⚠️ SECURITY: Pipeline logs may be accessible to unauthorized users. Only enable while investigating ephemeral test failures.'
      default: 'false'
  tasks:
    - name: prepare-cluster-env
      params:
        - name: HUB_COMPUTE_NODE_TYPE
          value: $(params.HUB_COMPUTE_NODE_TYPE)
        - name: MANAGED_COMPUTE_NODE_TYPE
          value: $(params.MANAGED_COMPUTE_NODE_TYPE)
        - name: HYPERSHIFT_NODE_COUNT
          value: $(params.HYPERSHIFT_NODE_COUNT)
        - name: HOSTED_MANAGEMENT_CLUSTER
          value: $(params.HOSTED_MANAGEMENT_CLUSTER)
      taskSpec:
        params:
          - name: HUB_COMPUTE_NODE_TYPE
          - name: MANAGED_COMPUTE_NODE_TYPE
          - name: HYPERSHIFT_NODE_COUNT
          - name: HOSTED_MANAGEMENT_CLUSTER
        results:
          - name: hub-env
            description: OpenShift CI workflow environment for the hub cluster as JSON.
          - name: managed-env
            description: OpenShift CI workflow environment for the managed cluster as JSON.
        steps:
          - name: prepare-env
            image: quay.io/konflux-ci/konflux-test:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              image_content_sources=$(cat <<'EOF'
              - source: registry.redhat.io/rhacm2
                mirrors:
                  - quay.io:443/acm-d
                  - quay.io/redhat-user-workloads/crt-redhat-acm-tenant
              - source: registry.redhat.io/multicluster-engine
                mirrors:
                  - quay.io:443/acm-d
              - source: registry.access.redhat.com/openshift4/ose-oauth-proxy
                mirrors:
                  - registry.redhat.io/openshift4/ose-oauth-proxy
              EOF
              )

              prepare_env() {
                jq -cn \
                  --arg computeNodeType "$1" \
                  --arg nodeCount "$(params.HYPERSHIFT_NODE_COUNT)" \
                  --arg managementCluster "$(params.HOSTED_MANAGEMENT_CLUSTER)" \
                  --arg imageContentSources "${image_content_sources}" \
                  '{
                    COMPUTE_NODE_TYPE: $computeNodeType,
                    HYPERSHIFT_NODE_COUNT: $nodeCount,
                    HOSTED_MANAGEMENT_CLUSTER: $managementCluster,
                    IMAGE_CONTENT_SOURCES: $imageContentSources
                  }'
              }

              prepare_env "$(params.HUB_COMPUTE_NODE_TYPE)" > "$(results.hub-env.path)"
              prepare_env "$(params.MANAGED_COMPUTE_NODE_TYPE)" > "$(results.managed-env.path)"
    - name: provision-hub
      runAfter:
        - prepare-cluster-env
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.OCP_VERSION)","architecture":"multi"}}}
        - name: env
          value: $(tasks.prepare-cluster-env.results.hub-env)
    - name: provision-managed
      runAfter:
        - prepare-cluster-env
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.OCP_VERSION)","architecture":"multi"}}}
        - name: env
          value: $(tasks.prepare-cluster-env.results.managed-env)
    - name: copy-pull-secret
      runAfter:
        - provision-hub
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/copy-secrets-to-ephemeral-cluster/0.1/copy-secrets-to-ephemeral-cluster.yaml
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-hub.results.secretRef)
        - name: namespace
          value: openshift-marketplace
        - name: labelSelector
          value: "konflux-copy=acm-d-pull-secret"
    - name: mco-install
      description: Install ACM via downstream dev catalog, MCO operator, and import managed cluster
      runAfter:
        - copy-pull-secret
        - provision-managed
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: ACM_VERSION
          value: "$(params.ACM_VERSION)"
        - name: MCE_VERSION
          value: "$(params.MCE_VERSION)"
        - name: DEBUG_DUMP_CREDENTIALS
          value: "$(params.DEBUG_DUMP_CREDENTIALS)"
        - name: HUB_CREDENTIALS_SECRET
          value: $(tasks.provision-hub.results.secretRef)
        - name: MANAGED_CREDENTIALS_SECRET
          value: $(tasks.provision-managed.results.secretRef)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: ACM_VERSION
            type: string
          - name: MCE_VERSION
            type: string
          - name: DEBUG_DUMP_CREDENTIALS
            type: string
          - name: HUB_CREDENTIALS_SECRET
            type: string
          - name: MANAGED_CREDENTIALS_SECRET
            type: string
        volumes:
          - name: hub-credentials
            secret:
              secretName: $(params.HUB_CREDENTIALS_SECRET)
          - name: managed-credentials
            secret:
              secretName: $(params.MANAGED_CREDENTIALS_SECRET)
        steps:
          - name: copy-pull-secret-to-managed
            env:
              - name: HUB_KUBECONFIG
                value: /credentials/hub/kubeconfig
              - name: MANAGED_KUBECONFIG
                value: /credentials/managed/kubeconfig
            volumeMounts:
              - name: hub-credentials
                mountPath: /credentials/hub
                readOnly: true
              - name: managed-credentials
                mountPath: /credentials/managed
                readOnly: true
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Setting up pull secret for managed cluster..."

              # Install jq
              dnf -y install jq >/dev/null 2>&1

              # Extract quay.io credentials from hub cluster's acm-mco-konflux-e2e secret
              QUAY_AUTH=$(oc --kubeconfig="${HUB_KUBECONFIG}" get secret acm-mco-konflux-e2e \
                -n openshift-marketplace -o jsonpath='{.data.\.dockerconfigjson}' | \
                base64 -d | jq -r '.auths["quay.io:443"].auth // .auths["quay.io"].auth // empty')

              if [[ -z "$QUAY_AUTH" ]]; then
                echo "ERROR: No quay.io auth found in acm-mco-konflux-e2e secret"
                exit 1
              fi

              # Create pull secret with only quay.io credentials
              jq -n --arg auth "${QUAY_AUTH}" \
                '{"auths": {"quay.io:443": {"auth": $auth, "email": ""}}}' \
                > /tmp/pull-secret.json

              # Create additional-pull-secret in kube-system (HyperShift Global Pull Secret feature)
              oc --kubeconfig="${MANAGED_KUBECONFIG}" create secret generic additional-pull-secret \
                -n kube-system \
                --from-file=.dockerconfigjson=/tmp/pull-secret.json \
                --type=kubernetes.io/dockerconfigjson \
                --dry-run=client -o yaml | \
                oc --kubeconfig="${MANAGED_KUBECONFIG}" apply -f - >/dev/null

              # Label nodes to enable global-pull-secret sync
              if ! oc --kubeconfig="${MANAGED_KUBECONFIG}" label nodes --all \
                hypershift.openshift.io/nodepool-globalps-enabled=true --overwrite; then
                echo "ERROR: Failed to enable global pull-secret synchronization"
                exit 1
              fi

              # Wait for HCCO to create global-pull-secret
              for i in $(seq 1 30); do
                if oc --kubeconfig="${MANAGED_KUBECONFIG}" get secret global-pull-secret -n kube-system &>/dev/null; then
                  echo "Pull secret configured successfully"
                  break
                fi
                if [[ $i -eq 30 ]]; then
                  echo "ERROR: global-pull-secret did not appear after 5 minutes"
                  exit 1
                fi
                sleep 10
              done
          - name: dump-credentials
            env:
              - name: DEBUG_DUMP_CREDENTIALS
                value: "$(params.DEBUG_DUMP_CREDENTIALS)"
              - name: HUB_KUBECONFIG
                value: /credentials/hub/kubeconfig
              - name: MANAGED_KUBECONFIG
                value: /credentials/managed/kubeconfig
            volumeMounts:
              - name: hub-credentials
                mountPath: /credentials/hub
                readOnly: true
              - name: managed-credentials
                mountPath: /credentials/managed
                readOnly: true
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              if [[ "${DEBUG_DUMP_CREDENTIALS}" != "true" ]]; then
                echo "DEBUG_DUMP_CREDENTIALS is not 'true' — skipping credential dump."
                exit 0
              fi

              echo "############################################################"
              echo "# WARNING: cluster admin credentials follow. Ephemeral      #"
              echo "# clusters are destroyed with their owning PipelineRun.     #"
              echo "# — copy what you need now.                                 #"
              echo "############################################################"

              echo "=== HUB CLUSTER ==="
              echo "API Server:  $(oc --kubeconfig="${HUB_KUBECONFIG}" whoami --show-server)"
              echo "Console:     $(oc --kubeconfig="${HUB_KUBECONFIG}" whoami --show-console)"
              echo "Username:    $(oc --kubeconfig="${HUB_KUBECONFIG}" whoami)"
              echo "--- HUB password ---"
              cat /credentials/hub/kubeAdminPassword; echo
              echo "--- HUB kubeconfig (base64 — decode with: base64 -d) ---"
              base64 -w0 "${HUB_KUBECONFIG}"; echo

              echo "=== MANAGED CLUSTER ==="
              echo "API Server:  $(oc --kubeconfig="${MANAGED_KUBECONFIG}" whoami --show-server)"
              echo "Console:     $(oc --kubeconfig="${MANAGED_KUBECONFIG}" whoami --show-console)"
              echo "Username:    $(oc --kubeconfig="${MANAGED_KUBECONFIG}" whoami)"
              echo "--- MANAGED password ---"
              cat /credentials/managed/kubeAdminPassword; echo
              echo "--- MANAGED kubeconfig (base64 — decode with: base64 -d) ---"
              base64 -w0 "${MANAGED_KUBECONFIG}"; echo
          - name: install
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KUBECONFIG
                value: /credentials/hub/kubeconfig
              - name: MANAGED_KUBECONFIG
                value: /credentials/managed/kubeconfig
              - name: ACM_VERSION
                value: $(params.ACM_VERSION)
              - name: MCE_VERSION
                value: $(params.MCE_VERSION)
            volumeMounts:
              - name: hub-credentials
                mountPath: /credentials/hub
                readOnly: true
              - name: managed-credentials
                mountPath: /credentials/managed
                readOnly: true
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Installing dependencies..."
              dnf -y install jq git gettext >/dev/null 2>&1

              echo "Cloning MCO repository..."
              GIT_URL=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^multicluster-observability-operator-acm-"))] | .[0].source.git.url')
              GIT_REVISION=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^multicluster-observability-operator-acm-"))] | .[0].source.git.revision')
              echo "Source: ${GIT_URL} @ ${GIT_REVISION}"
              git clone -q "${GIT_URL}" /tmp/mco
              cd /tmp/mco
              git checkout -q "${GIT_REVISION}"

              echo "Extracting component images from SNAPSHOT..."
              snapshot_image() {
                echo "${SNAPSHOT}" | jq -r "[.components[] | select(.name | test(\"^${1}-acm-\"))] | .[0].containerImage"
              }

              export MCO_IMAGE=$(snapshot_image "multicluster-observability-operator")
              export ENDPOINT_IMAGE=$(snapshot_image "endpoint-monitoring-operator")
              export METRICS_COLLECTOR_IMAGE=$(snapshot_image "metrics-collector")
              export RBAC_QUERY_PROXY_IMAGE=$(snapshot_image "rbac-query-proxy")
              export GRAFANA_DASHBOARD_LOADER_IMAGE=$(snapshot_image "grafana-dashboard-loader")

              echo "MCO operator image: ${MCO_IMAGE}"
              echo "Endpoint monitoring image: ${ENDPOINT_IMAGE}"
              echo "Metrics collector image: ${METRICS_COLLECTOR_IMAGE}"
              echo "RBAC query proxy image: ${RBAC_QUERY_PROXY_IMAGE}"
              echo "Grafana dashboard loader image: ${GRAFANA_DASHBOARD_LOADER_IMAGE}"

              echo "Setting up pull secrets..."
              ./dev-scripts/add-pull-secret.sh

              echo "Installing ACM via downstream catalog..."
              ./dev-scripts/setup-downstream-catalog.sh

              echo "Applying Konflux image overrides..."
              ./dev-scripts/image-override.sh

              echo "Waiting for MCO operator rollout..."
              TIMEOUT=600
              ELAPSED=0
              while true; do
                CURRENT_IMAGE=$(oc get deploy multicluster-observability-operator \
                  -n open-cluster-management \
                  -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
                if [[ "$CURRENT_IMAGE" == "$MCO_IMAGE" ]]; then
                  if ! oc rollout status deploy/multicluster-observability-operator \
                    -n open-cluster-management --timeout=300s; then
                    echo "ERROR: MCO operator rollout failed"
                    oc get pods -n open-cluster-management \
                      -l name=multicluster-observability-operator -o wide
                    exit 1
                  fi
                  break
                fi
                if [[ "$ELAPSED" -ge "$TIMEOUT" ]]; then
                  echo "ERROR: Timed out waiting for deployment image update"
                  echo "Expected: ${MCO_IMAGE}"
                  echo "Current:  ${CURRENT_IMAGE}"
                  oc get pods -n open-cluster-management -l name=multicluster-observability-operator -o wide
                  exit 1
                fi
                sleep 15
                ELAPSED=$((ELAPSED + 15))
              done

              echo "Importing managed cluster..."
              oc create namespace managed --dry-run=client -o yaml | oc apply -f -

              cat <<MCEOF | oc apply -f -
              apiVersion: cluster.open-cluster-management.io/v1
              kind: ManagedCluster
              metadata:
                name: managed
                labels:
                  cloud: auto-detect
                  vendor: auto-detect
              spec:
                hubAcceptsClient: true
              MCEOF

              oc create secret generic auto-import-secret \
                -n managed \
                --from-file=kubeconfig="${MANAGED_KUBECONFIG}" \
                --dry-run=client -o yaml | oc apply -f -

              oc wait managedcluster managed \
                --for=condition=ManagedClusterConditionAvailable=True \
                --timeout=300s || {
                echo "ERROR: Managed cluster did not become Available"
                echo "ManagedCluster status:"
                oc get managedcluster managed -o yaml
                echo "Klusterlet pods on managed cluster:"
                oc --kubeconfig="${MANAGED_KUBECONFIG}" get pods -n open-cluster-management-agent -o wide || true
                exit 1
              }

              echo "Deploying observability..."
              ./dev-scripts/setup-observability.sh || {
                echo "ERROR: MCO deployment failed"
                oc get pods -n open-cluster-management-observability -o wide
                oc get multiclusterobservability observability -o yaml
                exit 1
              }

              echo "MCO installation complete"
    - name: mco-e2e-tests
      description: Run MCO Ginkgo e2e test suite using existing run-e2e-tests.sh
      runAfter:
        - mco-install
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: HUB_CREDENTIALS_SECRET
          value: $(tasks.provision-hub.results.secretRef)
        - name: MANAGED_CREDENTIALS_SECRET
          value: $(tasks.provision-managed.results.secretRef)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: HUB_CREDENTIALS_SECRET
            type: string
          - name: MANAGED_CREDENTIALS_SECRET
            type: string
        volumes:
          - name: hub-credentials
            secret:
              secretName: $(params.HUB_CREDENTIALS_SECRET)
          - name: managed-credentials
            secret:
              secretName: $(params.MANAGED_CREDENTIALS_SECRET)
        steps:
          - name: run-e2e-tests
            resources:
              requests:
                memory: 4Gi
                cpu: "4"
              limits:
                memory: 8Gi
                cpu: "8"
            volumeMounts:
              - name: hub-credentials
                mountPath: /credentials/hub
                readOnly: true
              - name: managed-credentials
                mountPath: /credentials/managed
                readOnly: true
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KUBECONFIG
                value: /credentials/hub/kubeconfig
              - name: MANAGED_KUBECONFIG
                value: /credentials/managed/kubeconfig
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Installing dependencies..."
              dnf -y install jq vim unzip git make wget >/dev/null 2>&1

              echo "Installing Go..."
              curl -sLo /go.tar.gz https://go.dev/dl/go1.24.9.linux-amd64.tar.gz
              tar -C /usr/local -xzf /go.tar.gz
              export PATH=$PATH:/usr/local/go/bin
              export GOPATH=/tmp/go
              export GOBIN=/tmp/go/bin
              export GOCACHE=/tmp/.cache/go-build
              export PATH=$PATH:/tmp/go/bin
              mkdir -p /tmp/go/bin $GOCACHE
              chmod -R 777 /tmp/go/bin $GOPATH $GOCACHE

              echo "Cloning MCO repository..."
              GIT_URL=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^multicluster-observability-operator-acm-"))] | .[0].source.git.url')
              GIT_REVISION=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^multicluster-observability-operator-acm-"))] | .[0].source.git.revision')
              echo "Source: ${GIT_URL} @ ${GIT_REVISION}"
              git clone -q "${GIT_URL}" /tmp/mco
              cd /tmp/mco
              git checkout -q "${GIT_REVISION}"

              echo "Setting up test environment..."
              export MULTICLUSTER_OBSERVABILITY_OPERATOR_IMAGE_REF=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^multicluster-observability-operator-acm-"))] | .[0].containerImage')
              export ENDPOINT_MONITORING_OPERATOR_IMAGE_REF=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^endpoint-monitoring-operator-acm-"))] | .[0].containerImage')
              export METRICS_COLLECTOR_IMAGE_REF=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^metrics-collector-acm-"))] | .[0].containerImage')
              export RBAC_QUERY_PROXY_IMAGE_REF=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^rbac-query-proxy-acm-"))] | .[0].containerImage')
              export GRAFANA_DASHBOARD_LOADER_IMAGE_REF=$(echo "${SNAPSHOT}" | jq -r '[.components[] | select(.name | test("^grafana-dashboard-loader-acm-"))] | .[0].containerImage')

              export SHARED_DIR=/tmp/shared
              mkdir -p "${SHARED_DIR}"
              cp "${KUBECONFIG}" "${SHARED_DIR}/hub-1.kc"
              cp "${MANAGED_KUBECONFIG}" "${SHARED_DIR}/managed-1.kc"

              echo "Running e2e tests (MCOA only)..."
              export GINKGO_FOCUS="--focus mcoa/g"
              ./cicd-scripts/run-e2e-tests.sh

              echo "E2e tests completed"
