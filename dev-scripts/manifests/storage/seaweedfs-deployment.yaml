apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: open-cluster-management-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          # Override args (not command) so the image's default entrypoint still
          # dispatches to `mini`. Disables the WebDAV, Iceberg, and Lance
          # listeners that `mini` starts by default — none are used here
          args:
            - mini
            - -dir=/data
            - -webdav=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
          image: chrislusf/seaweedfs:4.29
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              value: seaweedfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfsadmin
            - name: S3_BUCKET
              value: acm-observability-thanostore
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
            - name: filer
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        # emptyDir is intentional: this is a dev-only setup, persistence is not needed.
        - name: storage
          emptyDir: {}
