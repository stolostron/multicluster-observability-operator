apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: open-cluster-management-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        # fsGroup grants write access to the emptyDir under whatever arbitrary
        # UID OpenShift assigns, since this image's entrypoint only self-fixes
        # /data ownership when started as root (which restricted SCCs disallow).
        # Deliberately omitted here (rather than hardcoded, e.g. to 1000): the
        # restricted SCC's fsGroup strategy is MustRunAs, constrained to a
        # per-namespace allocated range that a hardcoded value is very unlikely
        # to fall within, which would get the pod rejected at admission time.
        # Leaving it unset lets OpenShift auto-inject a value from that range,
        # and the kubelet grants the container the same GID as a supplemental
        # group on both the volume and the process, so the actual number
        # doesn't need to match anything baked into the image.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          # Default CMD is `mini -dir=/data`, which runs a single-process
          # master+volume+filer+S3 gateway — no custom command/args needed.
          image: chrislusf/seaweedfs:4.29
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              value: seaweedfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfsadmin
            - name: S3_BUCKET
              value: acm-observability-thanostore
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
            - name: filer
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        # emptyDir is intentional: this is a dev-only setup, persistence is not needed.
        - name: storage
          emptyDir: {}
